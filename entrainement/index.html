<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apprendre et s'entraîner</title>
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/entrainement.css">
</head>
<body>
<main>
  <a class="retour" href="../index.html">← Accueil</a>
  <h1>Apprendre et s'entraîner</h1>
  <p class="sub">Des exercices courts, corrigés tout de suite, pour progresser à votre rythme.</p>

  <div class="niveaux-entr" aria-label="Niveau"><span>A1 · bientôt</span><span class="actif">A2</span></div>

  <h2>Choisissez une rubrique</h2>
  <ul class="rubriques-entr" id="rubriques"></ul>
</main>
<script src="../js/langues.js"></script>
<script src="../js/entrainement/moteur.js"></script>
<script src="../data/entrainement/a2/liste.js"></script>
<script>
// Liste des rubriques du niveau A2, avec le score de la dernière série faite.
(function () {
  var E = Entr, esc = E.esc, l = E.langue();
  var codes = { en: "en", zh: "zh-Hans", vi: "vi" };
  var R = (window.LISTE_ENTRAINEMENT && window.LISTE_ENTRAINEMENT.a2) || [];
  document.getElementById("rubriques").innerHTML = R.map(function (r, i) {
    var tr = E.traduction(r.titre);
    return "<li><strong>" + (i + 1) + ". " + esc(E.fr(r.titre)) + "</strong>" +
      (tr ? '<span class="tr" lang="' + codes[l] + '">' + esc(tr) + "</span>" : "") +
      (r.bientot ? '<p class="aide"><b>Bientôt disponible.</b> En attendant, entraînez-vous à l\'oral avec les examens blancs de <a href="../index.html#preparer">« Préparer le DELF »</a>.</p>' : "") +
      r.series.map(function (s) {
        var sc = E.lireScore("a2-" + s.id);
        var etat = s.libre ? "" : sc ? ' <span class="fait">✔ ' + sc.score + " / " + sc.max + "</span>" : "";
        return '<a class="serie" href="serie.html?niveau=a2&amp;id=' + encodeURIComponent(s.id) + '">' + esc(s.titre) + etat + "</a>";
      }).join("") + "</li>";
  }).join("");
})();
</script>
</body>
</html>
